  </div>

  <div style="font-size: 15px; color: #4E5950">Загружаем данные датчиков…</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
class Component extends DCLogic {
  componentDidMount() {
    this.i = setInterval(() => {
      let p = ((this.state && this.state.p) || 0) + 1.5;
      if (p > 140) p = 0;
      this.setState({ p: p });
    }, 40);
  }
  componentWillUnmount() { clearInterval(this.i); }
  renderVals() {
    const p = (this.state && this.state.p) || 0;
    const level = Math.round(Math.min(p, 100));
    const h = 212 * level / 100;
    let color = '#4CD137', status = 'Норма';
    if (level >= 85) { color = '#C93A2B'; status = 'Пора вывозить'; }
    else if (level >= 60) { color = '#F2A93B'; status = 'Скоро заполнится'; }
    return { level: level, fillY: 274 - h, fillH: h, color: color, status: status };
  }
}
</script>
