<style>
body{margin:0;background:#050605}
a{color:#7FE06C}a:hover{color:#A6EE97}
input::placeholder{color:#6F7A70}
@keyframes okBlink{0%,100%{opacity:1}50%{opacity:.3}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important}}

</helmet>
<div style="position: relative; width: 100%; min-height: 900px; background: #050605; color: #F2F5F1; font-family: Inter, system-ui, sans-serif; overflow: hidden">
  <div style="position: absolute; inset: 0">
    <dc-import name="TruckSilhouette" placement="center" dim="0.35" hint-size="100%,100%"></dc-import>
  </div>

  <main style="position: relative; box-sizing: border-box; min-height: 900px; padding: 96px 24px; display: flex; justify-content: center; align-items: flex-start">
    <form style="box-sizing: border-box; width: 100%; max-width: 420px; padding: 40px; border-radius: 20px; background: rgba(14,17,15,0.88); border: 1px solid #1F2521; display: flex; flex-direction: column; gap: 22px">
      <div style="display: flex; justify-content: center">
        <dc-import name="Logo" dark="{{ true }}" size="26" hint-size="230px,40px"></dc-import>
      </div>
      <h1 style="margin: 4px 0 0; text-align: center; font-family: Unbounded, sans-serif; font-weight: 600; font-size: 26px; letter-spacing: -0.02em">Вход</h1>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="li-id" style="font-size: 14px; font-weight: 500; color: #C3CBC4">Email, телефон или логин</label>
        <input id="li-id" type="text" placeholder="name@example.com" sc-camel-auto-complete="username" style="box-sizing: border-box; width: 100%; height: 52px; padding: 0 16px; border-radius: 12px; border: 1px solid #2F3631; background: #0B0D0C; color: #F2F5F1; font: 400 16px Inter, system-ui, sans-serif">
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
          <label for="li-pass" style="font-size: 14px; font-weight: 500; color: #C3CBC4">Пароль</label>
          <a href="Verify_SMS.dc.html" style="font-size: 14px; text-decoration: none">Забыли пароль?</a>
        </div>
        <div style="position: relative">
          <input id="li-pass" type="{{passType}}" sc-camel-auto-complete="current-password" style="box-sizing: border-box; width: 100%; height: 52px; padding: 0 56px 0 16px; border-radius: 12px; border: 1px solid #2F3631; background: #0B0D0C; color: #F2F5F1; font: 400 16px Inter, system-ui, sans-serif">
          <button type="button" sc-camel-on-click="{{toggle}}" aria-label="{{toggleLabel}}" style="position: absolute; top: 4px; right: 4px; width: 44px; height: 44px; border: none; border-radius: 10px; background: transparent; color: #A9B2AA; display: flex; align-items: center; justify-content: center; cursor: pointer">
            <svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
      </div>

      <button type="button" style="min-height: 52px; border: none; border-radius: 12px; background: #4CD137; color: #08130A; font: 600 16px Inter, system-ui, sans-serif; cursor: pointer">Войти</button>
    </form>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
class Component extends DCLogic {
  renderVals() {
    const shown = !!(this.state && this.state.shown);
    return {
      passType: shown ? 'text' : 'password',
      toggleLabel: shown ? 'Скрыть пароль' : 'Показать пароль',
      toggle: () => this.setState({ shown: !shown })
    };
  }
}
</script>
