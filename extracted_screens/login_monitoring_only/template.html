<div style="width: 100%; min-height: 900px; box-sizing: border-box; padding: 96px 24px; background: #F4F6F2; color: #0E1410; font-family: Inter, system-ui, sans-serif; display: flex; justify-content: center; align-items: flex-start">
  <form style="box-sizing: border-box; width: 100%; max-width: 420px; padding: 40px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E0E5DE; box-shadow: 0 1px 2px rgba(14,20,16,0.04), 0 12px 32px rgba(14,20,16,0.06); display: flex; flex-direction: column; gap: 22px">
    <div style="display: flex; justify-content: center">
      <dc-import name="Logo" size="26" hint-size="230px,40px"></dc-import>
    </div>
    <h1 style="margin: 4px 0 0; text-align: center; font-family: Unbounded, sans-serif; font-weight: 600; font-size: 26px; letter-spacing: -0.02em">Вход</h1>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="lm-id" style="font-size: 14px; font-weight: 500; color: #3E4840">Email, телефон или логин</label>
      <input id="lm-id" type="text" placeholder="name@example.com" sc-camel-auto-complete="username" style="box-sizing: border-box; width: 100%; height: 52px; padding: 0 16px; border-radius: 12px; border: 1px solid #8A948A; background: #FFFFFF; color: #0E1410; font: 400 16px Inter, system-ui, sans-serif">
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
        <label for="lm-pass" style="font-size: 14px; font-weight: 500; color: #3E4840">Пароль</label>
        <a href="#" style="font-size: 14px; text-decoration: none">Забыли пароль?</a>
      </div>
      <div style="position: relative">
        <input id="lm-pass" type="{{passType}}" sc-camel-auto-complete="current-password" style="box-sizing: border-box; width: 100%; height: 52px; padding: 0 56px 0 16px; border-radius: 12px; border: 1px solid #8A948A; background: #FFFFFF; color: #0E1410; font: 400 16px Inter, system-ui, sans-serif">
        <button type="button" sc-camel-on-click="{{toggle}}" aria-label="{{toggleLabel}}" style="position: absolute; top: 4px; right: 4px; width: 44px; height: 44px; border: none; border-radius: 10px; background: transparent; color: #4E5950; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </button>
